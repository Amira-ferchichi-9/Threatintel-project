version: "3.9"

services:

  # ─── Redis Cache ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pfa_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ─── Orchestrateur Principal ───────────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pfa_orchestrator
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./reports:/app/reports
      - ./token_amira.json:/app/token_amira.json
      - ./credentials.json:/app/credentials.json
    restart: unless-stopped

volumes:
  redis_data:
